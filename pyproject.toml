[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bonehub-format"
version = "1.0.0"
description = "The BoneHub data format for 3D bone datasets, and the tools to convert, check and publish datasets in it."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Hamid Alavi"}
]

# The base install reads, validates and packs BoneHub-format datasets and needs only pydantic, so that projects which
# only read or write the metadata (such as the quality-check server) do not pull in ITK, DICOM or Parquet libraries.
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Reading and writing segmentation masks (.seg.nrrd).
io = [
    "numpy",
    "SimpleITK",
]
# Converting source datasets, and building the index, links, Hugging Face files and webpage of a root.
converter = [
    "numpy",
    "SimpleITK",
    "pydicom>=3.0.1",
    "highdicom>=0.28",
    "nibabel",
    "pandas",
    "openpyxl",
    "tqdm",
    "pyarrow",
]
all = [
    "bonehub-format[converter]",
]

[project.scripts]
bonehub-format = "bonehub_format.__main__:main"

[tool.setuptools.packages.find]
include = [
    "bonehub_format*",
]

[tool.setuptools.package-data]
bonehub_format = [
    "webpage_template/*",
    "webpage_template/.nojekyll",
]
